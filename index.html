<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tennis Freak – ATP &amp; WTA</title>
<!-- iOS "Add to Home Screen": Seite verhält sich wie eine App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tennis Freak">
<meta name="theme-color" content="#0b1120">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  /* Zielgerät: iPhone SE (375 x 667 pt) – kompakter Kopfbereich,
     damit möglichst viel Platz für die Match-Liste bleibt */
  :root {
    --bg: #0b1120;          /* dunkler Hintergrund */
    --card: #151f36;        /* Turnier-Karten */
    --card-inner: #1c2942;  /* Match-Zeilen */
    --text: #e9eef8;
    --muted: #8d99b2;
    --accent: #d8e84a;      /* Tennisball-Gelbgrün */
    --live: #ff5263;
    --border: #263350;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.35;
    /* Platz für die Home-Leiste und die schwebende Status-Leiste unten */
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- Kopfbereich (sticky): drei kompakte Schalter-Reihen ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(11, 17, 32, 0.93);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    /* Platz für die iOS-Statusleiste im Standalone-Modus */
    padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .seg {
    display: flex;
    background: var(--card-inner);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 2px;
    gap: 2px;
  }
  .seg button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
    padding: 7px 0;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
  }
  .seg button.active { background: var(--accent); color: #1a2208; }
  .seg-tour button { font-size: 15px; }

  /* Titelzeile mit Ball und Aktualisieren-Knopf */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
  h1 .ball { color: var(--accent); }

  /* Disziplin-Wahl: dezente Text-Tabs, die mit dem Header verschmelzen */
  .tabs-discipline { display: flex; justify-content: center; gap: 26px; }
  .tabs-discipline button {
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--muted);
    font-weight: 600;
    font-size: 13px;
    padding: 2px 6px 5px;
    border-bottom: 2px solid transparent;
  }
  .tabs-discipline button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  /* Status-Wahl: schwebende "Liquid Glass"-Leiste am unteren Rand */
  .bottombar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 20;
    display: flex;
    gap: 2px;
    padding: 3px;
    border-radius: 999px;
    background: rgba(30, 44, 72, 0.55);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
  }
  .bottombar button {
    border: none;
    background: transparent;
    color: #c3cce0;
    font-weight: 700;
    font-size: 12px;
    padding: 7px 10px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .bottombar button.active { background: var(--accent); color: #1a2208; }

  /* ---------- Weltrangliste ---------- */
  .rank-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-no {
    min-width: 26px;
    text-align: right;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 700;
    flex: none;
  }
  .rank-row .name { color: var(--text); }
  .trend { flex: none; font-size: 10.5px; font-weight: 700; }
  .trend.up { color: #4ade80; }
  .trend.down { color: var(--live); }
  .rank-pts {
    flex: none;
    min-width: 48px;
    text-align: right;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }

  #refreshBtn {
    background: var(--card-inner);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    width: 38px;
    height: 30px;
    flex: none;
    cursor: pointer;
  }
  #refreshBtn.spinning svg { animation: spin 0.9s linear infinite; }
  #refreshBtn svg { display: block; margin: auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Anzahl der Live-Matches als kleine rote Marke im "Live"-Tab */
  .count {
    background: var(--live);
    color: #fff;
    border-radius: 8px;
    font-size: 10px;
    padding: 1px 5px;
    vertical-align: 2px;
  }
  .bottombar button.active .count { background: #1a2208; color: var(--accent); }

  /* ---------- Statuszeile ---------- */
  .statusline {
    padding: 6px 12px 0;
    font-size: 11px;
    color: var(--muted);
  }
  .statusline .error { color: var(--live); font-weight: 600; }

  /* ---------- Inhalt: Matches nach Turnier gruppiert ---------- */
  main { padding: 8px 10px 0; max-width: 640px; margin: 0 auto; }
  .hint { color: var(--muted); text-align: center; padding: 36px 16px; }

  .tournament {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    padding: 4px 8px 8px;
  }
  .tournament > h2 {
    font-size: 14.5px;
    margin: 0;
    padding: 7px 4px 1px;
  }
  .tournament .venue {
    padding: 0 4px 7px;
    font-size: 11px;
    color: var(--muted);
  }

  /* Kleine Zwischenüberschrift je Runde innerhalb eines Turniers */
  .round-h {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--muted);
    font-weight: 700;
    margin: 8px 4px 5px;
  }

  /* ---------- Einzelnes Match ---------- */
  .match {
    background: var(--card-inner);
    border-radius: 9px;
    padding: 7px 9px;
    margin-bottom: 5px;
  }
  .match:last-child { margin-bottom: 0; }
  .match-meta {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .live-badge {
    color: var(--live);
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--live);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.25; } }

  .row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
  }
  .flagwrap { display: inline-flex; gap: 3px; flex: none; }
  .flag { width: 17px; height: 11px; object-fit: cover; border-radius: 2px; display: block; }
  .name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 14px;
  }
  .name.winner { color: var(--text); font-weight: 700; }
  .name.playing { color: var(--text); }
  .seed { color: var(--muted); font-size: 11.5px; font-weight: 400; }
  .serve { color: var(--accent); font-size: 9px; vertical-align: 1px; }

  .sets { display: flex; gap: 2px; flex: none; }
  .set {
    min-width: 20px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 14px;
  }
  .set.won { color: var(--text); font-weight: 700; }
  .set.cur { color: var(--accent); font-weight: 700; }
  .set sup { font-size: 9px; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 10.5px;
    padding: 12px 16px 2px;
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <h1><span class="ball">●</span> Tennis Freak</h1>
    <button id="refreshBtn" type="button" aria-label="Refresh" title="Refresh">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
  </div>
  <div class="seg seg-tour" role="tablist" data-key="tour">
    <button data-val="atp" role="tab">ATP</button>
    <button data-val="wta" role="tab">WTA</button>
  </div>
  <div class="tabs-discipline" role="tablist" data-key="discipline">
    <button data-val="singles" role="tab">Singles</button>
    <button data-val="doubles" role="tab">Doubles</button>
  </div>
</header>

<div id="status" class="statusline"></div>
<main id="content"><div class="hint">Loading scores …</div></main>
<footer>Data: ESPN scoreboard (ATP &amp; WTA) · times in German time</footer>

<nav class="bottombar" role="tablist" data-key="status">
  <button data-val="in" role="tab" id="liveTab">Live</button>
  <button data-val="post" role="tab">Finished</button>
  <button data-val="pre" role="tab">Upcoming</button>
  <button data-val="rankings" role="tab">Rankings</button>
</nav>

<script>
'use strict';

/* =====================================================================
   Tennis Live – aggregiert ATP- und WTA-Spielstände in einer Ansicht.
   Navigation: Tour (ATP/WTA) → Disziplin (Singles/Doubles) →
   Status (Live/Finished/Upcoming); Matches nach Turnier gruppiert.
   Datenquelle: öffentliches ESPN-Scoreboard-JSON (sendet CORS "*",
   daher direkt aus dem Browser abrufbar – kein Server nötig).
   ===================================================================== */

const API = {
  atp: 'https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard',
  wta: 'https://site.api.espn.com/apis/site/v2/sports/tennis/wta/scoreboard',
};
const RANKINGS_API = {
  atp: 'https://site.api.espn.com/apis/site/v2/sports/tennis/atp/rankings',
  wta: 'https://site.api.espn.com/apis/site/v2/sports/tennis/wta/rankings',
};
const REFRESH_MS = 60_000;            // automatische Aktualisierung der aktiven Tour
const RANKINGS_TTL = 3_600_000;       // Rangliste ändert sich wöchentlich – 1 h Cache reicht

// Auswahl aus dem letzten Besuch wiederherstellen (ungültige Werte ignorieren)
function restore(key, allowed, fallback) {
  const v = localStorage.getItem(key);
  return allowed.includes(v) ? v : fallback;
}

const state = {
  tour: restore('tour', ['atp', 'wta'], 'atp'),
  discipline: restore('discipline', ['singles', 'doubles'], 'singles'),
  status: restore('status', ['in', 'post', 'pre', 'rankings'], 'in'),
  data: { atp: null, wta: null },       // zuletzt geladene Scoreboard-Rohdaten je Tour
  fetchedAt: { atp: 0, wta: 0 },        // Zeitstempel der letzten Aktualisierung
  rankings: { atp: null, wta: null },   // Weltrangliste je Tour (nur Einzel im Feed)
  rankingsAt: { atp: 0, wta: 0 },
  loading: false,
  error: null,
};

/* ---------- kleine Helfer ---------- */

// HTML-Sonderzeichen maskieren (Spielernamen kommen aus Fremddaten)
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

const fmtTime = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit' });
const fmtDay = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Berlin', weekday: 'short', day: 'numeric', month: 'short' });
const fmtClock = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', second: '2-digit' });

// Startzeit eines angesetzten Matches ("14:30" heute, sonst mit Datum)
function formatStart(dateStr, timeValid) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const sameDay = fmtDay.format(d) === fmtDay.format(new Date());
  if (timeValid === false) return sameDay ? 'today, time TBC' : fmtDay.format(d) + ', time TBC';
  return sameDay ? fmtTime.format(d) : fmtDay.format(d) + ', ' + fmtTime.format(d);
}

// Rundennamen in britische Schreibweise bringen
function roundLabel(name) {
  if (!name) return '';
  return name.replace(/Quarterfinal/g, 'Quarter-final').replace(/Semifinal/g, 'Semi-final');
}

// Zusatz-Status für beendete Matches (nur Besonderheiten wie Aufgabe)
function finishedNote(type) {
  const d = type?.detail || '';
  if (/retired/i.test(d)) return 'Retired';
  if (/walkover/i.test(d)) return 'Walkover';
  if (/default/i.test(d)) return 'Defaulted';
  return '';
}

// Name eines Teilnehmers (Einzel: "athlete", Doppel-Team: "roster")
function compName(comp) {
  if (comp?.athlete) return comp.athlete.shortName || comp.athlete.displayName || 'TBC';
  if (comp?.roster) return comp.roster.shortDisplayName || comp.roster.displayName || 'TBC';
  return 'TBC';
}

// Flaggen eines Teilnehmers (beim Doppel: beide Spielerinnen/Spieler)
function compFlags(comp) {
  if (comp?.athlete?.flag) return [comp.athlete.flag];
  if (Array.isArray(comp?.roster?.athletes)) {
    return comp.roster.athletes.map((a) => a.flag).filter(Boolean);
  }
  return [];
}

/* ---------- Daten laden ---------- */

async function loadTour(tour) {
  // cache: 'no-store', damit Safari keine veralteten Stände anzeigt
  const res = await fetch(API[tour], { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  state.data[tour] = await res.json();
  state.fetchedAt[tour] = Date.now();
}

async function loadRankings(tour) {
  const res = await fetch(RANKINGS_API[tour], { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const d = await res.json();
  state.rankings[tour] = d.rankings?.[0] || null;
  state.rankingsAt[tour] = Date.now();
}

// Gemeinsamer Lade-Rahmen: Fehler deutlich anzeigen,
// aber die letzten bekannten Daten stehen lassen
async function withLoading(tour, loader) {
  if (state.loading) return;
  state.loading = true;
  updateChrome();
  try {
    await loader(tour);
    state.error = null;
  } catch (e) {
    state.error = 'Update failed (' + e.message + ')';
  }
  state.loading = false;
  if (tour === state.tour) render();
  updateChrome();
}

const refresh = (tour = state.tour) => withLoading(tour, loadTour);
const refreshRankings = (tour = state.tour) => withLoading(tour, loadRankings);

// Rangliste nur laden, wenn sie fehlt oder älter als die TTL ist
function ensureRankings(tour) {
  if (!state.rankings[tour] || Date.now() - state.rankingsAt[tour] > RANKINGS_TTL) {
    refreshRankings(tour);
  }
}

/* ---------- Filterung ---------- */

// Konkurrenzen nach Tour filtern: kombinierte Turniere (z. B. Libéma Open)
// tauchen in beiden Feeds mit allen Konkurrenzen auf
function belongsToTour(name, tour) {
  if (tour === 'atp') return !/^Women's/.test(name || '');
  return !/^Men's/.test(name || '');
}

// Disziplin-Filter; Mixed Doubles zählt zu Doubles
function belongsToDiscipline(name, discipline) {
  if (discipline === 'singles') return /Singles/.test(name || '');
  return /Doubles/.test(name || '');
}

// Matches der aktuellen Auswahl sammeln, nach Turnier und darin nach
// Runde gruppiert. Rückgabe: null solange keine Daten geladen sind
function matchesFor(tour, discipline, status) {
  const d = state.data[tour];
  if (!d) return null;
  const groups = [];
  for (const ev of d.events || []) {
    const byRound = new Map(); // Rundenname -> Matches
    for (const g of ev.groupings || []) {
      const gname = g.grouping?.displayName || '';
      if (!belongsToTour(gname, tour)) continue;
      if (!belongsToDiscipline(gname, discipline)) continue;
      const mixed = /^Mixed/.test(gname);
      for (const c of g.competitions || []) {
        if (c.status?.type?.state !== status) continue;
        const rname = c.round?.displayName || '';
        if (!byRound.has(rname)) byRound.set(rname, []);
        byRound.get(rname).push({ c, mixed });
      }
    }
    // Beendete: Neueste zuerst; Live/Anstehende: Früheste zuerst
    const rounds = [...byRound.entries()].map(([name, matches]) => {
      matches.sort((a, b) => status === 'post'
        ? new Date(b.c.date) - new Date(a.c.date)
        : new Date(a.c.date) - new Date(b.c.date));
      return { name, matches };
    });
    // Runden zeitlich ordnen (erstes Match ist nach obiger Sortierung
    // der Anker): Beendete – zuletzt gespielte Runde zuerst,
    // sonst – als Nächstes gespielte Runde zuerst
    rounds.sort((a, b) => status === 'post'
      ? new Date(b.matches[0].c.date) - new Date(a.matches[0].c.date)
      : new Date(a.matches[0].c.date) - new Date(b.matches[0].c.date));
    if (rounds.length) groups.push({ ev, rounds });
  }
  return groups;
}

/* ---------- Darstellung ---------- */

function setsHtml(comp, status) {
  const live = status?.type?.state === 'in';
  const curIdx = (status?.period || 0) - 1; // laufender Satz (1-basiert)
  const ls = comp?.linescores || [];
  return ls.map((s, i) => {
    const val = (s?.value ?? '') === '' ? '' : Math.trunc(s.value);
    const tb = s?.tiebreak != null ? '<sup>' + esc(s.tiebreak) + '</sup>' : '';
    const cls = ['set', s?.winner ? 'won' : '', live && i === curIdx ? 'cur' : ''].filter(Boolean).join(' ');
    return '<span class="' + cls + '">' + val + tb + '</span>';
  }).join('');
}

function rowHtml(comp, status) {
  const live = status?.type?.state === 'in';
  const flags = compFlags(comp).map((f) =>
    '<img class="flag" loading="lazy" src="' + esc(f.href) + '" alt="' + esc(f.alt || '') + '">'
  ).join('');
  const nameCls = comp?.winner ? 'name winner' : (live ? 'name playing' : 'name');
  // Setzlisten-Nummer in Klammern (ESPN: curatedRank.current, 99 = ungesetzt)
  const seed = comp?.curatedRank?.current;
  const seedHtml = seed >= 1 && seed < 99 ? ' <span class="seed">(' + seed + ')</span>' : '';
  // Aufschlag-Indikator: possession markiert bei Live-Matches den Aufschläger
  const serveHtml = live && comp?.possession === true
    ? ' <span class="serve" title="Serving">●</span>' : '';
  return '<div class="row">' +
    '<span class="flagwrap">' + flags + '</span>' +
    '<span class="' + nameCls + '">' + esc(compName(comp)) + seedHtml + serveHtml + '</span>' +
    '<span class="sets">' + setsHtml(comp, status) + '</span>' +
    '</div>';
}

function matchHtml({ c, mixed }) {
  const st = c.status || {};
  const stateCode = st.type?.state;
  const parts = [];
  if (mixed) parts.push('Mixed');
  // Court des Matches (im Feed teils leer, dann weglassen);
  // die Runde steht als Zwischenüberschrift über der Gruppe
  const court = (c.venue?.court || '').trim();
  if (court) parts.push(esc(court));
  if (stateCode === 'in') {
    parts.push('<span class="live-badge"><span class="live-dot"></span>LIVE · ' + esc(st.type?.detail || '') + '</span>');
  } else if (stateCode === 'pre') {
    parts.push(esc(formatStart(c.date, c.timeValid)));
  } else {
    const note = finishedNote(st.type);
    if (note) parts.push(esc(note));
  }
  const comps = (c.competitors || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  return '<div class="match">' +
    (parts.length ? '<div class="match-meta">' + parts.join(' · ') + '</div>' : '') +
    comps.map((comp) => rowHtml(comp, st)).join('') +
    '</div>';
}

function tournamentHtml({ ev, rounds }) {
  const venue = ev.venue?.fullName || '';
  const body = rounds.map(({ name, matches }) =>
    (name ? '<h3 class="round-h">' + esc(roundLabel(name)) + '</h3>' : '') +
    matches.map(matchHtml).join('')
  ).join('');
  return '<section class="tournament">' +
    '<h2>' + esc(ev.name || 'Tournament') + '</h2>' +
    (venue ? '<div class="venue">' + esc(venue) + '</div>' : '') +
    body +
    '</section>';
}

const EMPTY = {
  in: 'No live matches at the moment.',
  post: 'No finished matches yet.',
  pre: 'No upcoming matches scheduled.',
};

const fmtPoints = new Intl.NumberFormat('en-GB');

// Eine Zeile der Weltrangliste: Platz, Flagge, Name, Trend, Punkte
function rankRowHtml(e) {
  const a = e.athlete || {};
  // Im Rankings-Feed ist flag ein nackter URL-String (im Scoreboard ein Objekt)
  const flagUrl = typeof a.flag === 'string' ? a.flag : a.flag?.href;
  const flag = flagUrl
    ? '<img class="flag" loading="lazy" src="' + esc(flagUrl) + '" alt="">'
    : '';
  // Trend aus dem Feed: "+2", "-1" oder "-" (unverändert)
  const t = (e.trend || '').trim();
  let trend = '';
  if (t.startsWith('+')) trend = '<span class="trend up">▲' + esc(t.slice(1)) + '</span>';
  else if (t.startsWith('-') && t !== '-') trend = '<span class="trend down">▼' + esc(t.slice(1)) + '</span>';
  return '<div class="rank-row">' +
    '<span class="rank-no">' + esc(e.current) + '</span>' +
    '<span class="flagwrap">' + flag + '</span>' +
    '<span class="name">' + esc(a.displayName || a.shortname || '–') + '</span>' +
    trend +
    '<span class="rank-pts">' + (e.points != null ? fmtPoints.format(e.points) : '') + '</span>' +
    '</div>';
}

function renderRankings() {
  const content = document.getElementById('content');
  const r = state.rankings[state.tour];
  if (!r) {
    content.innerHTML = '<div class="hint">' + (state.error ? esc(state.error) : 'Loading rankings …') + '</div>';
    return;
  }
  const ranks = r.ranks || [];
  const updated = r.update ? ' · updated ' + fmtDay.format(new Date(r.update)) : '';
  content.innerHTML = '<section class="tournament">' +
    '<h2>' + esc(state.tour.toUpperCase()) + ' World Ranking</h2>' +
    '<div class="venue">Singles · Top ' + ranks.length + updated + '</div>' +
    ranks.map(rankRowHtml).join('') +
    '</section>';
}

function render() {
  if (state.status === 'rankings') {
    renderRankings();
    return;
  }
  const content = document.getElementById('content');
  const groups = matchesFor(state.tour, state.discipline, state.status);
  if (groups === null) {
    content.innerHTML = '<div class="hint">' + (state.error ? esc(state.error) : 'Loading scores …') + '</div>';
    return;
  }
  content.innerHTML = groups.length
    ? groups.map(tournamentHtml).join('')
    : '<div class="hint">' + EMPTY[state.status] + '</div>';
}

// Kopfzeile: aktive Schalter, Live-Zähler, Lade-Anzeige, Zeitstempel, Fehler
function updateChrome() {
  document.querySelectorAll('[data-key]').forEach((group) => {
    const key = group.dataset.key;
    group.querySelectorAll('button').forEach((b) => {
      b.classList.toggle('active', b.dataset.val === state[key]);
    });
  });
  // Anzahl der Live-Matches der aktuellen Tour/Disziplin im Live-Tab anzeigen
  const liveGroups = matchesFor(state.tour, state.discipline, 'in');
  const n = liveGroups
    ? liveGroups.reduce((s, g) => s + g.rounds.reduce((t, r) => t + r.matches.length, 0), 0)
    : 0;
  document.getElementById('liveTab').innerHTML = 'Live' + (n ? ' <span class="count">' + n + '</span>' : '');

  // Singles/Doubles greift in der Rankings-Ansicht nicht (Feed hat nur Einzel)
  document.querySelector('.tabs-discipline').style.display =
    state.status === 'rankings' ? 'none' : 'flex';

  document.getElementById('refreshBtn').classList.toggle('spinning', state.loading);
  const status = document.getElementById('status');
  const ts = state.fetchedAt[state.tour];
  let html = ts ? 'Updated ' + fmtClock.format(new Date(ts)) : '';
  if (state.error) html += (html ? ' · ' : '') + '<span class="error">' + esc(state.error) + '</span>';
  status.innerHTML = html;
}

/* ---------- Interaktion ---------- */

function select(key, val) {
  state[key] = val;
  localStorage.setItem(key, val);
  updateChrome();
  render();
  // Beim Tour-Wechsel nachladen, falls die Daten fehlen oder veraltet sind
  if (key === 'tour' && (!state.data[val] || Date.now() - state.fetchedAt[val] > REFRESH_MS)) {
    refresh(val);
  }
  // Rangliste bei Bedarf laden (Wechsel in die Ansicht oder der Tour darin)
  if (state.status === 'rankings') ensureRankings(state.tour);
}

document.querySelectorAll('[data-key] button').forEach((b) => {
  b.addEventListener('click', () => select(b.closest('[data-key]').dataset.key, b.dataset.val));
});
document.getElementById('refreshBtn').addEventListener('click', () =>
  state.status === 'rankings' ? refreshRankings() : refresh());

// Automatisch aktualisieren, aber nur solange die Seite sichtbar ist
setInterval(() => {
  if (document.visibilityState === 'visible' &&
      Date.now() - state.fetchedAt[state.tour] >= REFRESH_MS) {
    refresh();
  }
}, 15_000);

// Beim Zurückkehren zur App (Home-Bildschirm) sofort frische Daten holen
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' &&
      Date.now() - state.fetchedAt[state.tour] >= REFRESH_MS) {
    refresh();
  }
});

/* ---------- Start ---------- */
updateChrome();
refresh().then(() => {
  // Startet die App in der gemerkten Rankings-Ansicht, Rangliste nachladen
  if (state.status === 'rankings') ensureRankings(state.tour);
  // Die jeweils andere Tour im Hintergrund vorladen, damit der Wechsel sofort klappt
  const other = state.tour === 'atp' ? 'wta' : 'atp';
  loadTour(other).catch(() => { /* Vorladen ist optional; Fehler zeigt der Wechsel selbst */ });
});
</script>
</body>
</html>
